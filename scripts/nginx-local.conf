# Generated by node scripts/configure-web.mjs from security-headers.json.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.3/dist/iife/reader/index.js; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://fonts.gstatic.com https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.3/; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
